<svg xmlns="http://www.w3.org/2000/svg" width="300" height="600" viewBox="0 0 300 600">
  <defs>
    <linearGradient id="bannerRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#540e0c"/>
      <stop offset="25%" stop-color="#7a1815"/>
      <stop offset="75%" stop-color="#8f1e1a"/>
      <stop offset="100%" stop-color="#4a0c0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Wooden Support Rod -->
    <rect x="20" y="25" width="260" height="14" rx="4" fill="#3a2312" stroke="#1d1108" stroke-width="2"/>
    <circle cx="20" cy="32" r="12" fill="url(#goldGrad)"/>
    <circle cx="280" cy="32" r="12" fill="url(#goldGrad)"/>
    <!-- Hanging cord -->
    <path d="M 60 25 L 150 5 L 240 25" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Banner Fabric Main Body -->
    <path d="M 40 37 L 260 37 L 260 480 L 150 560 L 40 480 Z" fill="url(#bannerRed)" stroke="#2b0605" stroke-width="3"/>

    <!-- Gold Ornate Border Trim -->
    <path d="M 48 45 L 252 45 L 252 472 L 150 545 L 48 472 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
    <path d="M 56 53 L 244 53 L 244 465 L 150 532 L 56 465 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

    <!-- Heraldic Lion Rampant Emblem -->
    <g transform="translate(85, 140) scale(1.3)" fill="url(#goldGrad)">
      <!-- Lion Crown -->
      <path d="M 35 15 L 42 5 L 50 18 L 58 5 L 65 15 Z" fill="url(#goldGrad)"/>
      <!-- Lion Head & Mane -->
      <path d="M 42 22 C 32 24 25 35 28 48 C 30 55 38 60 45 60 C 50 60 55 56 58 48 C 62 40 55 25 42 22 Z"/>
      <!-- Open Jaws & Tongue -->
      <path d="M 27 34 L 20 32 L 25 40 Z" fill="#e63946"/>
      <!-- Body & Raised Paws -->
      <path d="M 45 58 C 42 75 40 95 48 115 C 50 120 56 125 65 125 C 72 125 78 118 75 110 C 72 100 60 90 56 75 Z"/>
      <path d="M 32 40 L 15 28 L 22 22 L 35 32 Z"/>
      <path d="M 35 50 L 12 45 L 15 37 L 35 42 Z"/>
      <path d="M 52 110 L 30 135 L 38 142 L 58 120 Z"/>
      <path d="M 55 120 L 45 145 L 55 150 L 65 128 Z"/>
      <!-- Crowned Tail with Fluff -->
      <path d="M 68 115 C 95 110 100 70 85 50 C 78 40 85 30 92 38 C 98 45 105 85 75 125 Z"/>
    </g>

    <!-- Gold Tassels at Bottom -->
    <g fill="url(#goldGrad)">
      <rect x="40" y="480" width="8" height="25" rx="2"/>
      <rect x="95" y="520" width="8" height="25" rx="2"/>
      <rect x="146" y="560" width="8" height="28" rx="2"/>
      <rect x="197" y="520" width="8" height="25" rx="2"/>
      <rect x="252" y="480" width="8" height="25" rx="2"/>
    </g>
  </g>
</svg>
