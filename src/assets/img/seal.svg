<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="waxGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#b81d18"/>
      <stop offset="45%" stop-color="#7e100c"/>
      <stop offset="85%" stop-color="#4d0805"/>
      <stop offset="100%" stop-color="#260302"/>
    </radialGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="50%" stop-color="#c99e32"/>
      <stop offset="100%" stop-color="#7a5a12"/>
    </linearGradient>
    <filter id="waxShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#waxShadow)">
    <!-- Organic Irregular Wax Outer Edge Stamp -->
    <path d="M 150 15 
             C 185 10, 215 25, 240 45 
             C 265 65, 285 95, 285 130 
             C 290 170, 275 205, 250 235 
             C 225 265, 190 285, 150 285 
             C 110 285, 75 270, 50 240 
             C 20 210, 10 170, 15 135 
             C 10 95, 30 60, 55 40 
             C 80 20, 115 15, 150 15 Z" fill="url(#waxGrad)" stroke="#3b0503" stroke-width="4"/>

    <!-- Inner Pressed Ring -->
    <circle cx="150" cy="150" r="105" fill="none" stroke="url(#goldSeal)" stroke-width="4" opacity="0.85"/>
    <circle cx="150" cy="150" r="95" fill="none" stroke="url(#goldSeal)" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.75"/>

    <!-- Circular Guild Inscription Text around Ring -->
    <path id="textPath" d="M 65 150 A 85 85 0 1 1 235 150 A 85 85 0 1 1 65 150" fill="none"/>
    <text font-family="Cinzel, serif" font-size="13" font-weight="bold" fill="url(#goldSeal)" letter-spacing="3">
      <textPath href="#textPath" startOffset="50%" text-anchor="middle">
        MERCATUM REGNI • ANNO 1024
      </textPath>
    </text>

    <!-- Center Emblem: Crown & Crossed Swords -->
    <g transform="translate(150, 150) scale(0.85)" fill="url(#goldSeal)">
      <!-- Crown -->
      <path d="M -30 -35 L -18 -60 L 0 -40 L 18 -60 L 30 -35 Z" stroke="#3b0503" stroke-width="1"/>
      <circle cx="-18" cy="-62" r="3.5"/>
      <circle cx="0" cy="-42" r="3.5"/>
      <circle cx="18" cy="-62" r="3.5"/>
      <rect x="-30" y="-33" width="60" height="8" rx="2"/>

      <!-- Crossed Swords -->
      <!-- Sword 1 -->
      <path d="M -45 45 L 35 -35 M -50 50 L -42 42 M 30 -30 L 40 -40" stroke="url(#goldSeal)" stroke-width="5" stroke-linecap="round"/>
      <!-- Sword 2 -->
      <path d="M 45 45 L -35 -35 M 50 50 L 42 42 M -30 -30 L -40 -40" stroke="url(#goldSeal)" stroke-width="5" stroke-linecap="round"/>

      <!-- Guild Shield -->
      <path d="M -20 -10 L 20 -10 L 20 15 C 20 30 0 42 0 42 C 0 42 -20 30 -20 15 Z" fill="url(#waxGrad)" stroke="url(#goldSeal)" stroke-width="3"/>
      <!-- Shield Fleur-de-lis -->
      <path d="M 0 0 C -6 5 -8 15 0 24 C 8 15 6 5 0 0 Z M -8 12 C -12 8 -16 12 -10 18 Z M 8 12 C 12 8 16 12 10 18 Z" fill="url(#goldSeal)"/>
    </g>
  </g>
</svg>
