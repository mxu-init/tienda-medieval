<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ebd9c0"/>
      <stop offset="35%" stop-color="#dfcbaf"/>
      <stop offset="70%" stop-color="#e8d6bd"/>
      <stop offset="100%" stop-color="#d4c0a3"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a3520" stop-opacity="0.32"/>
    </radialGradient>
    <filter id="pTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fff8eb" surfaceScale="2" result="light">
        <feDistantLight azimuth="60" elevation="50"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#pGrad)"/>
  <rect width="800" height="800" fill="url(#vignette)"/>
  <!-- Organic parchment age stains -->
  <path d="M 50 120 Q 200 40 420 180 T 750 100 Q 820 400 680 720 T 200 780 Q -50 500 50 120 Z" fill="#8c6a43" opacity="0.06"/>
  <path d="M 300 50 Q 550 -20 700 250 T 500 650 Q 180 820 100 500 Z" fill="#694d2e" opacity="0.04"/>
</svg>
