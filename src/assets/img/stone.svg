<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="stoneGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2723"/>
      <stop offset="100%" stop-color="#181614"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0 0.11  0.2 0 0 0 0.8" result="colored"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <pattern id="bricks" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#221f1c"/>
      <!-- Row 1 -->
      <rect x="2" y="2" width="96" height="46" rx="2" fill="#2b2723" stroke="#141210" stroke-width="3"/>
      <rect x="102" y="2" width="96" height="46" rx="2" fill="#282420" stroke="#141210" stroke-width="3"/>
      <!-- Row 2 -->
      <rect x="2" y="52" width="46" height="46" rx="2" fill="#26221f" stroke="#141210" stroke-width="3"/>
      <rect x="52" y="52" width="96" height="46" rx="2" fill="#2f2a25" stroke="#141210" stroke-width="3"/>
      <rect x="152" y="52" width="46" height="46" rx="2" fill="#272320" stroke="#141210" stroke-width="3"/>
      <!-- Row 3 -->
      <rect x="2" y="102" width="96" height="46" rx="2" fill="#2e2a25" stroke="#141210" stroke-width="3"/>
      <rect x="102" y="102" width="96" height="46" rx="2" fill="#25221e" stroke="#141210" stroke-width="3"/>
      <!-- Row 4 -->
      <rect x="2" y="152" width="146" height="46" rx="2" fill="#272420" stroke="#141210" stroke-width="3"/>
      <rect x="152" y="152" width="46" height="46" rx="2" fill="#2a2622" stroke="#141210" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bricks)"/>
  <rect width="400" height="400" fill="url(#stoneGlow)" opacity="0.4" style="mix-blend-mode: overlay;"/>
</svg>
