<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4cc" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffaa00" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#ff6600" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="35%" stop-color="#aa820a"/>
      <stop offset="70%" stop-color="#e6c65c"/>
      <stop offset="100%" stop-color="#553e05"/>
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Radiant Light Background Aura -->
  <circle cx="150" cy="220" r="140" fill="url(#lanternGlow)"/>

  <g transform="translate(0, 10)">
    <!-- Hanging Chain -->
    <path d="M 150 0 L 150 70" stroke="url(#brassGrad)" stroke-width="6" stroke-dasharray="10 4"/>

    <!-- Lantern Top Cap & Ring -->
    <circle cx="150" cy="70" r="14" fill="none" stroke="url(#brassGrad)" stroke-width="5"/>
    <path d="M 110 110 Q 150 80 190 110 L 180 130 L 120 130 Z" fill="url(#brassGrad)" stroke="#3a2a03" stroke-width="2"/>
    <rect x="130" y="95" width="40" height="15" rx="3" fill="url(#brassGrad)"/>

    <!-- Glass Chamber & Flame -->
    <polygon points="120,130 180,130 195,270 105,270" fill="#fff5da" opacity="0.85"/>
    <ellipse cx="150" cy="220" r="25" fill="#ffea9f" filter="url(#glowFilter)"/>
    <path d="M 150 190 Q 160 215 150 230 Q 140 215 150 190 Z" fill="#ff4500"/>
    <path d="M 150 200 Q 155 215 150 226 Q 145 215 150 200 Z" fill="#ffee55"/>

    <!-- Brass Lattice Grid Framing -->
    <polygon points="120,130 180,130 195,270 105,270" fill="none" stroke="url(#brassGrad)" stroke-width="6"/>
    <!-- Vertical Struts -->
    <line x1="142" y1="130" x2="137" y2="270" stroke="url(#brassGrad)" stroke-width="4"/>
    <line x1="158" y1="130" x2="163" y2="270" stroke="url(#brassGrad)" stroke-width="4"/>
    <!-- Diagonal Lattice Wire -->
    <path d="M 120 130 L 195 270 M 180 130 L 105 270" stroke="url(#brassGrad)" stroke-width="2" opacity="0.7"/>

    <!-- Bottom Metal Base & Spire -->
    <path d="M 105 270 L 195 270 L 175 300 L 125 300 Z" fill="url(#brassGrad)" stroke="#3a2a03" stroke-width="2"/>
    <polygon points="150,340 140,300 160,300" fill="url(#brassGrad)"/>
    <circle cx="150" cy="345" r="7" fill="url(#brassGrad)"/>
  </g>
</svg>
